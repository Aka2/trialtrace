name: Deploy front to AWS

# Se déclenche à chaque push sur main
on:
  push:
    branches: [main]

# Permissions nécessaires pour l'authentification OIDC
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Installer Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3. Installer les dépendances et builder le front
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      # 4. S'authentifier auprès d'AWS via OIDC (jeton temporaire)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      # 5. Envoyer le build sur S3
      - name: Deploy to S3
        run: aws s3 sync web/dist/ s3://trialtrace-web-a6705ek23 --delete

      # 6. Rafraîchir le cache CloudFront
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[?contains(DomainName, 'trialtrace-web-a6705ek23')]].Id" --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"